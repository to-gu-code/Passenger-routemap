<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都営新宿線 乗降客数路線図｜Toei Shinjuku Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     基本設計（枠線レス・面分割・カラーユニバーサルデザイン）
  ========================================================= */
  :root {
    --bg-canvas: #EAEAEA;
    --bg-sheet: #FFFFFF;
    --bg-subtle: #F4F4F4;
    --ink-primary: #181818;
    --ink-secondary: #5A5A5A;
    --ink-muted: #808080;
    --axis-line: #333333;
    --grid-major: #DCDCDC;
    --grid-minor: #EFEFEF;

    /* 路線固有テーマ（JSからも上書き可能） */
    --line-theme: #8DC21F;

    /* カラーユニバーサルデザイン（CUD推奨：低明度ブルー × 高明度アンバー） */
    --cud-board: #005A9C;
    --cud-alight: #F5A623;
  }

  * {
    box-sizing: border-box;
    border-radius: 0 !important;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans JP", sans-serif;
    background-color: var(--bg-canvas);
    color: var(--ink-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     ヘッダー＆コントロールバー（ミニマル・鉄道図表スタイル）
  ========================================================= */
  .top-header {
    background: var(--bg-sheet);
    padding: 18px 28px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-main-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 14px;
  }

  .route-title-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .route-emblem {
    width: 38px;
    height: 38px;
    border-radius: 50% !important;
    border: 6px solid var(--line-theme);
    background: #FFFFFF;
    color: var(--ink-primary);
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .route-title-texts h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .route-title-texts p {
    margin: 3px 0 0;
    font-family: "Inter", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-secondary);
    letter-spacing: 0.02em;
  }

  .header-right-info {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
  }

  .period-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-secondary);
    background: var(--bg-subtle);
    padding: 5px 10px;
  }

  .cud-legend {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    font-weight: 700;
  }

  .cud-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cud-chip {
    width: 14px;
    height: 14px;
    display: inline-block;
  }

  /* コントロールバー（面の色分けのみで構造化） */
  .control-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px 24px;
    background: var(--bg-subtle);
    padding: 10px 14px;
  }

  .ctrl-block {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .ctrl-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-secondary);
    white-space: nowrap;
  }

  /* 表示内訳セグメント */
  .seg-group {
    display: inline-flex;
    background: #E2E2E2;
    padding: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    padding: 5px 12px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-secondary);
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .seg-btn:hover {
    color: var(--ink-primary);
  }

  .seg-btn.active {
    background: var(--ink-primary);
    color: #FFFFFF;
  }

  /* スケール伸縮コントロール（スライダー＋自由入力） */
  .scale-ctrl-wrap {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  input[type="range"].scale-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 160px;
    height: 4px;
    background: #CCCCCC;
    outline: none;
    cursor: pointer;
  }

  input[type="range"].scale-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 18px;
    background: var(--ink-primary);
    cursor: pointer;
  }

  input[type="range"].scale-slider::-moz-range-thumb {
    width: 14px;
    height: 18px;
    border: none;
    background: var(--ink-primary);
    cursor: pointer;
  }

  .scale-input-box {
    display: inline-flex;
    align-items: center;
    background: #FFFFFF;
    padding: 3px 8px;
    gap: 4px;
  }

  .scale-num-input {
    width: 48px;
    border: none;
    border-bottom: 1.5px solid var(--ink-primary);
    font-family: "Roboto Condensed", sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    color: var(--ink-primary);
    background: transparent;
    padding: 1px 2px;
    outline: none;
  }

  .scale-unit-text {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-secondary);
  }

  .quick-scale-btn {
    border: none;
    background: #E2E2E2;
    color: var(--ink-primary);
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 9px;
    cursor: pointer;
  }

  .quick-scale-btn:hover {
    background: #D4D4D4;
  }

  /* =========================================================
     メイン盤面（余白と軸だけで構成する路線図キャンバス）
  ========================================================= */
  .canvas-wrapper {
    overflow-x: auto;
    background: var(--bg-sheet);
    margin: 18px 28px;
    padding: 34px 24px 24px;
  }

  .chart-matrix {
    display: flex;
    min-width: 1380px;
  }

  /* =========================================================
     駅ナンバリング（全駅共通・ラインカラー枠）
  ========================================================= */
  .st-code-badge {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 30px;
    border: 2.5px solid var(--line-theme);
    background: #FFFFFF;
    color: var(--ink-primary);
    font-family: "Roboto Condensed", "Inter", sans-serif;
    line-height: 1;
    flex-shrink: 0;
  }

  .st-code-prefix {
    font-size: 8.5px;
    font-weight: 700;
    margin-bottom: 1px;
  }

  .st-code-num {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* 注釈マーク（期間限定表示用） */
  .st-note-mark {
    font-size: 10px;
    font-weight: 900;
    color: #D91E2A;
    margin-left: 1px;
  }

  /* 乗換路線サイン（路線カラー矩形・CUD考慮の濃い文字コントラスト） */
  .tr-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    height: 18px;
    padding: 0 4px;
    border-left: 4px solid var(--tr-color, #555);
    background: #F4F4F4;
    color: var(--ink-primary);
    font-family: "Roboto Condensed", "Inter", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }

  .tr-more-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    height: 17px;
    padding: 0 4px;
    background: #E6E6E6;
    color: var(--ink-secondary);
    font-family: "Roboto Condensed", sans-serif;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
  }

  /* =========================================================
     ツールチップ
  ========================================================= */
  #tooltip {
    position: absolute;
    background: #181818;
    color: #FFFFFF;
    padding: 9px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 1000;
    white-space: nowrap;
    line-height: 1.55;
  }

  #tooltip .tt-code {
    font-family: "Roboto Condensed", sans-serif;
    font-weight: 700;
  }

  #tooltip .tt-note {
    display: inline-block;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid #444444;
    color: #FFD166;
    font-size: 11px;
    font-weight: 700;
  }

  /* =========================================================
     乗換一覧モーダル（不要な枠線を排したフラットダイアログ）
  ========================================================= */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.15s;
    padding: 16px;
  }

  .modal-overlay.show {
    display: flex;
    opacity: 1;
  }

  .modal-panel {
    background: #FFFFFF;
    padding: 22px;
    width: 100%;
    max-width: 440px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 3px solid var(--line-theme);
  }

  .modal-head-titles h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 900;
  }

  .modal-head-titles span {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
  }

  .modal-list {
    list-style: none;
    padding: 0;
    margin: 0 0 18px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .modal-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg-subtle);
    font-size: 13px;
    font-weight: 700;
  }

  .modal-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-code-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 48px;
    height: 22px;
    padding: 0 6px;
    border-left: 5px solid var(--tr-color, #555);
    background: #FFFFFF;
    font-family: "Roboto Condensed", sans-serif;
    font-size: 12px;
    font-weight: 700;
  }

  .modal-note-tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-secondary);
    background: #E6E6E6;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .modal-close {
    width: 100%;
    padding: 10px;
    border: none;
    background: var(--ink-primary);
    color: #FFFFFF;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .modal-close:hover {
    background: #333333;
  }

  /* =========================================================
     グラフ共通パーツ
  ========================================================= */
  .grid-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .graph-cell {
    position: relative;
  }

  .bar-stack {
    display: flex;
    position: relative;
  }

  .bar-part {
    position: relative;
    z-index: 1;
    transition: flex-basis 0.2s ease-out, opacity 0.12s;
    cursor: pointer;
  }

  .bar-part:hover {
    opacity: 0.82;
  }

  .bar-cut-svg {
    position: absolute;
    z-index: 4;
    pointer-events: none;
  }

  .bar-cap-label {
    position: absolute;
    z-index: 5;
    font-family: "Roboto Condensed", "Noto Sans JP", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-primary);
    background: rgba(255, 255, 255, 0.92);
    padding: 0 3px;
    white-space: nowrap;
    line-height: 1.2;
  }

  /* =========================================================
     PCレイアウト（768px以上）
  ========================================================= */
  @media (min-width: 768px) {
    .chart-matrix {
      flex-direction: row;
      align-items: stretch;
      height: 670px;
    }

    /* 左軸ラベル列（Y軸線のみ残し、不要な横仕切り線を排除） */
    .axis-column {
      display: flex;
      flex-direction: column;
      width: 120px;
      flex-shrink: 0;
    }

    .y-axis-labels {
      flex-grow: 1;
      position: relative;
      border-right: 1.5px solid var(--axis-line);
      border-bottom: 1.5px solid var(--axis-line);
    }

    .y-tick-label {
      position: absolute;
      bottom: var(--pos);
      right: 10px;
      transform: translateY(50%);
      font-family: "Roboto Condensed", "Noto Sans JP", sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      white-space: nowrap;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }

    .y-tick-label.is-zero {
      bottom: 2px;
      transform: none;
    }

    .y-unit {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .station-axis-spacer {
      height: 196px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 12px 10px 0;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .service-axis-labels {
      display: flex;
      flex-direction: column;
      padding: 4px 0;
    }

    .service-row {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-right: 12px;
    }

    .service-swatch-line {
      width: 24px;
      height: 11px;
      background-color: var(--srv-color);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .service-swatch-line::after {
      content: "";
      width: 8px;
      height: 8px;
      background: #FFFFFF;
      border-radius: 50% !important;
    }

    .service-names {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.1;
    }

    .service-jp {
      font-size: 11.5px;
      font-weight: 900;
      color: var(--ink-primary);
    }

    .service-en {
      font-family: "Inter", sans-serif;
      font-size: 9px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .transfer-axis-spacer {
      height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-end;
      padding: 10px 12px 0 0;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* 各駅カラム（縦罫線なしで余白と軸だけで整列） */
    .station-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 58px;
      position: relative;
    }

    .graph-cell {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      border-bottom: 1.5px solid var(--axis-line);
    }

    .grid-h-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--pos);
      border-bottom: 1px solid var(--grid-minor);
    }

    .grid-h-line.major {
      border-bottom: 1px solid var(--grid-major);
    }

    /* 積み上げ棒（下：乗車＝CUD青、上：降車＝CUDアンバー） */
    .bar-stack {
      width: 24px;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }

    .bar-alight {
      flex-basis: var(--alight-pct);
      width: 100%;
      border-bottom: 1px solid #FFFFFF;
    }

    .bar-board {
      flex-basis: var(--board-pct);
      width: 100%;
    }

    .bar-cut-svg {
      top: 16%;
      left: -4px;
      width: 32px;
      height: 12px;
    }

    .bar-cap-label {
      top: -19px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 駅名ブロック */
    .station-meta-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 196px;
      width: 100%;
      padding: 8px 2px 8px;
      position: relative;
    }

    .station-meta-cell::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      height: 8px;
      background-color: #B0B0B0;
      transform: translateX(-50%);
    }

    .bilingual-name-box {
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-end;
      justify-content: center;
      height: 146px;
      margin-bottom: 6px;
      gap: 1px;
    }

    .st-name-jp {
      writing-mode: vertical-rl;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.04em;
      color: var(--ink-primary);
    }

    .st-name-jp.is-express {
      font-size: 13.5px;
      font-weight: 900;
    }

    .st-sub-jp {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-secondary);
    }

    .st-note-mark {
      margin-left: 0;
      margin-top: 2px;
    }

    .st-name-en {
      writing-mode: vertical-rl;
      font-family: "Inter", sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      line-height: 1;
      color: var(--ink-muted);
    }

    /* 路線帯エリア（上：各駅停車＝黄緑、下：急行＝赤） */
    .route-tracks-cell {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 4px 0;
      position: relative;
    }

    /* 駅の縦軸ガイドライン */
    .route-tracks-cell::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      background-color: #B0B0B0;
      transform: translateX(-50%);
      z-index: 1;
    }

    .service-track {
      height: 34px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-track::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 11px;
      background-color: var(--srv-color);
      z-index: 1;
    }

    /* 始発・終着駅で帯を端に揃える */
    .station-col:nth-child(2) .service-track::before {
      width: 50%;
      right: 0;
    }
    .station-col:last-child .service-track::before {
      width: 50%;
      left: 0;
    }

    /* 乗換路線サイン列 */
    .transfer-cell {
      height: 112px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      position: relative;
    }

    .transfer-cell.clickable {
      cursor: pointer;
    }

    .transfer-cell.clickable::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 1.5px;
      height: 8px;
      background-color: #B0B0B0;
      transform: translateX(-50%);
    }

    .transfer-list-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 2px;
    }

    .transfer-cell.clickable:hover .transfer-list-col {
      background: var(--bg-subtle);
    }
  }

  /* =========================================================
     スマホレイアウト（767px以下）
  ========================================================= */
  @media (max-width: 767px) {
    .top-header {
      padding: 12px 14px;
    }

    .route-title-texts h1 {
      font-size: 1.05rem;
    }

    .canvas-wrapper {
      margin: 10px;
      padding: 10px 10px 14px;
      overflow-x: visible;
    }

    .chart-matrix {
      flex-direction: column;
      min-width: auto;
    }

    .axis-column {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 70px;
      flex-shrink: 0;
      position: sticky;
      top: 154px;
      background: #FFFFFF;
      z-index: 20;
      border-bottom: 1.5px solid var(--axis-line);
    }

    .service-axis-labels {
      order: 1;
      display: flex;
      flex-direction: row;
      margin-right: 8px;
    }

    .service-row {
      width: 28px;
      writing-mode: vertical-rl;
      display: flex;

<header class="top-header">
  <div class="header-main-row">
    <div class="route-title-group">
      <div class="route-emblem" id="route-symbol">S</div>
      <div class="route-title-texts">
        <h1 id="route-title-jp">都営新宿線 乗降客数路線図</h1>
        <p id="route-title-en">Toei Shinjuku Line Passenger Volume &amp; Route Map</p>
      </div>
    </div>
    <div class="header-right-info">
      <span class="period-label" id="route-period">2025年4月〜2026年3月｜一日平均乗降人員</span>
      <div class="cud-legend">
        <span class="cud-legend-item"><span class="cud-chip" style="background: var(--cud-board);"></span>乗車人員</span>
        <span class="cud-legend-item"><span class="cud-chip" style="background: var(--cud-alight);"></span>降車人員</span>
      </div>
    </div>
  </div>

  <div class="control-strip">
    <!-- 表示内訳切替 -->
    <div class="ctrl-block">
      <span class="ctrl-label">表示内訳</span>
      <div class="seg-group" id="mode-selector">
        <button class="seg-btn active" onclick="setMode(event, 'total')">乗降合算</button>
        <button class="seg-btn" onclick="setMode(event, 'board')">乗車人員</button>
        <button class="seg-btn" onclick="setMode(event, 'alight')">降車人員</button>
      </div>
    </div>

    <!-- スケール伸縮コントロール（他路線でも汎用的に動作） -->
    <div class="ctrl-block">
      <span class="ctrl-label">表示上限スケール</span>
      <div class="scale-ctrl-wrap">
        <input type="range" class="scale-slider" id="scale-slider" min="5" max="35" step="1" value="15" oninput="onSliderInput(this.value)">

          <input type="number" class="scale-num-input" id="scale-num-input" min="1" max="200" step="1" value="15" onchange="onNumberChange(this.value)" onkeydown="if(event.key==='Enter') this.blur();">
          <span class="scale-unit-text">万人</span>
        </div>
        <button class="quick-scale-btn" onclick="applyPresetScale('standard')">標準倍率</button>
        <button class="quick-scale-btn" onclick="applyPresetScale('fit')">全体表示</button>

</footer>

  /* =========================================================
     期間限定注釈の有効判定（該当の日付を過ぎたら自動消去）
  ========================================================= */
  function getActiveStationNote(station, now = new Date()) {
    if (!station.note || !station.note.expiresAt) return null;
    const expiryDate = new Date(station.note.expiresAt);
    return now < expiryDate ? station.note : null;
  }

  function renderFooterNotes() {
    const notesContainer = document.getElementById('route-notes');
    const now = new Date();
    const activeNotes = ROUTE_CONFIG.stations
      .map(st => getActiveStationNote(st, now))
      .filter(Boolean);

    if (activeNotes.length === 0) {
      notesContainer.innerHTML = '';
      notesContainer.style.display = 'none';
      return;
    }

    notesContainer.style.display = 'block';
    notesContainer.innerHTML = activeNotes
      .map(n => `<div class="route-note-item"><span class="route-note-mark">※</span>${n.footerText}</div>`)
      .join('');
  }

  /* =========================================================
     状態管理＆自動スケール計算（データ値から自動算出）
  ========================================================= */
  let currentMode = 'total'; // 'total' | 'board' | 'alight'
  let scaleMaxMan = 15; // 単位：万人

  function getStationMetric(st, mode) {
    if (mode === 'board') return st.board;
    if (mode === 'alight') return st.alight;
    return st.board + st.alight;
  }

  function getDataBounds(mode) {
    const vals = ROUTE_CONFIG.stations.map(st => getStationMetric(st, mode)).sort((a, b) => b - a);
    const maxVal = vals[0] || 100000;
    const secondVal = vals[1] || maxVal;
    const fullMaxMan = Math.ceil((maxVal * 1.1) / 10000);
    const stdMaxMan = Math.max(5, Math.ceil((secondVal * 1.15) / 10000));
    return { fullMaxMan, stdMaxMan };
  }

  function syncScaleControls(newValMan) {
    const { fullMaxMan } = getDataBounds(currentMode);
    const slider = document.getElementById('scale-slider');
    const numInput = document.getElementById('scale-num-input');

    const sliderMax = Math.max(fullMaxMan, newValMan);
    slider.max = sliderMax;
    slider.min = Math.max(2, Math.floor(fullMaxMan * 0.1));
    slider.value = newValMan;
    numInput.value = newValMan;
    scaleMaxMan = newValMan;
  }

  function onSliderInput(val) {
    const num = Math.max(1, parseInt(val, 10) || 15);
    scaleMaxMan = num;
    document.getElementById('scale-num-input').value = num;
    renderChart();
  }

  function onNumberChange(val) {
    let num = parseInt(val, 10);
    if (isNaN(num) || num < 1) num = 1;
    if (num > 500) num = 500;
    syncScaleControls(num);
    renderChart();
  }

  function applyPresetScale(presetType) {
    const { fullMaxMan, stdMaxMan } = getDataBounds(currentMode);
    const target = presetType === 'fit' ? fullMaxMan : stdMaxMan;
    syncScaleControls(target);
    renderChart();
  }

  function setMode(ev, modeStr) {
    currentMode = modeStr;
    document.querySelectorAll('#mode-selector .seg-btn').forEach(b => b.classList.remove('active'));
    ev.currentTarget.classList.add('active');

    const { stdMaxMan } = getDataBounds(currentMode);
    syncScaleControls(stdMaxMan);
    renderChart();
  }

  /* =========================================================
     目盛り自動生成ロジック（任意の上限値に対応）
  ========================================================= */
  function buildTicks(maxMan) {
    const candidates = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50];
    let step = candidates[candidates.length - 1];
    for (const c of candidates) {
      if (maxMan / c <= 6) {
        step = c;
        break;
      }
    }

    const ticks = [];
    for (let v = 0; v < maxMan - 1e-6; v += step) {
      const cleanV = Math.round(v * 10) / 10;
      ticks.push({
        val: cleanV * 10000,
        label: cleanV === 0 ? '0' : `${cleanV}万`,
        major: true
      });
    }
    ticks.push({
      val: maxMan * 10000,
      label: `${maxMan}万`,
      major: true,
      isTop: true
    });
    return ticks;
  }

  /* =========================================================
     パーツ生成関数
  ========================================================= */
  function createStationBadgeHtml(station) {
    return `
      <div class="st-code-badge">
        <span class="st-code-prefix">${station.prefix}</span>
        <span class="st-code-num">${station.num}</span>
      </div>
    `;
  }

  function createBreakSvgHtml(isMobile) {
    if (isMobile) {
      return `
        <svg class="bar-cut-svg" viewBox="0 0 12 28" preserveAspectRatio="none">
          <polygon points="3,0 9,0 7,28 1,28" fill="#FFFFFF" />
          <line x1="3" y1="0" x2="1" y2="28" stroke="#181818" stroke-width="1.5" />
          <line x1="9" y1="0" x2="7" y2="28" stroke="#181818" stroke-width="1.5" />
        </svg>
      `;
    }
    return `
      <svg class="bar-cut-svg" viewBox="0 0 32 12" preserveAspectRatio="none">
        <polygon points="0,4 32,1 32,7 0,10" fill="#FFFFFF" />
        <line x1="0" y1="4" x2="32" y2="1" stroke="#181818" stroke-width="1.5" />
        <line x1="0" y1="10" x2="32" y2="7" stroke="#181818" stroke-width="1.5" />
      </svg>
    `;
  }

  function createTransferHtml(station, isMobile) {
    const list = ROUTE_CONFIG.transfers[station.code];
    if (!list || list.length === 0) {
      return isMobile ? '' : '<div class="transfer-cell"></div>';
    }

    const maxVisible = isMobile ? list.length : 4;
    const shown = list.slice(0, maxVisible);
    const hiddenCount = list.length - shown.length;

    let badges = shown.map(tr =>
      `<span class="tr-badge" style="--tr-color: ${tr.color};" title="${tr.line}${tr.note ? '（' + tr.note + '）' : ''}">${tr.code}</span>`
    ).join('');

    if (hiddenCount > 0) {
      badges += `<span class="tr-more-badge">+${hiddenCount}</span>`;
    }

    if (isMobile) {
      return `<div class="mobile-tr-wrap" onclick="openTransferModal('${station.code}')">${badges}</div>`;
    }

    return `
      <div class="transfer-cell clickable" onclick="openTransferModal('${station.code}')" title="クリックで乗り換え路線を表示">
        <div class="transfer-list-col">${badges}</div>
      </div>
    `;
  }

  /* =========================================================
     メイン描画処理
  ========================================================= */
  function renderChart() {
    const matrix = document.getElementById('chart-matrix');
    const maxP = scaleMaxMan * 10000;
    const ticks = buildTicks(scaleMaxMan);
    const isMobile = window.innerWidth <= 767;
    const now = new Date();

    renderFooterNotes();

    // 背景グリッド
    let gridHtml = '<div class="grid-layer">';
    ticks.forEach(t => {
      if (t.val === 0) return;
      gridHtml += `<div class="grid-h-line major" style="--pos: ${(t.val / maxP) * 100}%;"></div>`;
    });
    gridHtml += '</div>';

    // 軸目盛りラベル
    let axisLabelsHtml = '';
    ticks.forEach((t, i) => {
      const isZero = t.val === 0;
      const isTop = Boolean(t.isTop);
      if (isMobile && ticks.length > 5 && i % 2 === 1 && !isTop) return;

      const classes = ['y-tick-label'];
      if (isZero) classes.push('is-zero');
      if (isTop) classes.push('is-max');

      let content = t.label;
      if (isTop) {
        content = isMobile
          ? `${t.label}<span class="y-unit">(人)</span>`
          : `<span class="y-unit">（人）</span>${t.label}`;
      }

      axisLabelsHtml += `<div class="${classes.join(' ')}" style="--pos: ${(t.val / maxP) * 100}%;">${content}</div>`;
    });

    // 種別凡例（左軸下部）
    let servicesAxisHtml = '';
    ROUTE_CONFIG.services.forEach(srv => {
      servicesAxisHtml += `
        <div class="service-row" style="--srv-color: ${srv.color};">
          <div class="service-names">
            <span class="service-jp">${srv.name}</span>
            <span class="service-en">${srv.en}</span>
          </div>
          <div class="service-swatch-line"></div>
        </div>
      `;
    });

    let html = `
      <div class="axis-column">
        <div class="y-axis-labels">${axisLabelsHtml}</div>
        <div class="station-axis-spacer">駅名・駅番号</div>
        <div class="service-axis-labels">${servicesAxisHtml}</div>
        <div class="transfer-axis-spacer">乗換路線</div>
      </div>
    `;

    // 各駅データ列
    ROUTE_CONFIG.stations.forEach(st => {
      const total = st.board + st.alight;
      const activeVal = getStationMetric(st, currentMode);
      const isOverflow = activeVal > maxP;
      const isExpress = st.stops.includes("express");
      const activeNote = getActiveStationNote(st, now);

      let boardPct = 0;
      let alightPct = 0;

      if (isOverflow) {
        if (currentMode === 'total') {
          boardPct = (st.board / total) * 100;
          alightPct = (st.alight / total) * 100;
        } else if (currentMode === 'board') {
          boardPct = 100;
        } else {
          alightPct = 100;
        }
      } else {
        boardPct = (st.board / maxP) * 100;
        alightPct = (st.alight / maxP) * 100;
        if (currentMode === 'board') alightPct = 0;
        if (currentMode === 'alight') boardPct = 0;
      }

      const overflowHtml = isOverflow
        ? `${createBreakSvgHtml(isMobile)}<div class="bar-cap-label">${(activeVal / 10000).toFixed(1)}万</div>`
        : '';

      let tracksHtml = '';
      ROUTE_CONFIG.services.forEach(srv => {
        const stopsHere = st.stops.includes(srv.id);
        tracksHtml += `
          <div class="service-track" style="--srv-color: ${srv.color};">
            <div class="stop-dot ${stopsHere ? '' : 'is-pass'}"></div>
          </div>
        `;
      });

      const badgeHtml = createStationBadgeHtml(st);
      const trHtml = createTransferHtml(st, isMobile);
      const subNameHtml = st.subName ? `<span class="st-sub-jp">${st.subName}</span>` : '';
      const noteMarkHtml = activeNote ? `<span class="st-note-mark" title="※${activeNote.shortText}">※</span>` : '';
      const noteAttr = activeNote ? `data-note="${activeNote.shortText}"` : '';

      if (isMobile) {
        html += `
          <div class="station-col">
            <div class="graph-cell">
              ${gridHtml}
              <div class="bar-stack" style="--board-pct: ${boardPct}%; --alight-pct: ${alightPct}%;">
                <div class="bar-part bar-board" style="background-color: var(--cud-board);"
                     data-code="${st.code}" data-name="${st.name}${st.subName || ''}" data-en="${st.en}"
                     data-total="${total}" data-board="${st.board}" data-alight="${st.alight}" ${noteAttr}></div>
                <div class="bar-part bar-alight" style="background-color: var(--cud-alight);"
                     data-code="${st.code}" data-name="${st.name}${st.subName || ''}" data-en="${st.en}"
                     data-total="${total}" data-board="${st.board}" data-alight="${st.alight}" ${noteAttr}></div>
                ${overflowHtml}
              </div>
            </div>
            <div class="station-meta-cell">
              <div class="mobile-st-row">
                ${badgeHtml}
                <div class="mobile-st-labels">
                  <span class="st-name-jp ${isExpress ? 'is-express' : ''}">${st.name}${subNameHtml}${noteMarkHtml}</span>
                  <span class="st-name-en">${st.en}</span>
                </div>
              </div>
              ${trHtml}
            </div>
            <div class="route-tracks-cell">
              ${tracksHtml}
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="station-col">
            <div class="graph-cell">
              ${gridHtml}
              <div class="bar-stack" style="--board-pct: ${boardPct}%; --alight-pct: ${alightPct}%;">
                <div class="bar-part bar-alight" style="background-color: var(--cud-alight);"
                     data-code="${st.code}" data-name="${st.name}${st.subName || ''}" data-en="${st.en}"
                     data-total="${total}" data-board="${st.board}" data-alight="${st.alight}" ${noteAttr}></div>
                <div class="bar-part bar-board" style="background-color: var(--cud-board);"
                     data-code="${st.code}" data-name="${st.name}${st.subName || ''}" data-en="${st.en}"
                     data-total="${total}" data-board="${st.board}" data-alight="${st.alight}" ${noteAttr}></div>
                ${overflowHtml}
              </div>
            </div>
            <div class="station-meta-cell">
              <div class="bilingual-name-box">
                <span class="st-name-jp ${isExpress ? 'is-express' : ''}">${noteMarkHtml}${subNameHtml}${st.name}</span>
                <span class="st-name-en">${st.en}</span>
              </div>
              ${badgeHtml}
            </div>
            <div class="route-tracks-cell">
              ${tracksHtml}
            </div>
            ${trHtml}
          </div>
        `;
      }
    });

    matrix.innerHTML = html;
    bindTooltipEvents();
  }

  /* =========================================================
     ツールチップ＆乗換モーダル
  ========================================================= */
  function bindTooltipEvents() {
    const tooltip = document.getElementById('tooltip');
    document.querySelectorAll('.bar-part').forEach(el => {
      const show = (e) => {
        const code = el.getAttribute('data-code');
        const name = el.getAttribute('data-name');
        const en = el.getAttribute('data-en');
        const note = el.getAttribute('data-note');
        const total = parseInt(el.getAttribute('data-total'), 10).toLocaleString();
        const board = parseInt(el.getAttribute('data-board'), 10).toLocaleString();
        const alight = parseInt(el.getAttribute('data-alight'), 10).toLocaleString();

        let text = `<span class="tt-code">${code}</span> <strong>${name}</strong> <span style="color:#BBBBBB; font-size:11px;">(${en})</span><br>`;
        if (currentMode === 'total' || currentMode === 'alight') {
          text += `<span style="color:var(--cud-alight);">■</span> 降車人員：${alight}人<br>`;
        }
        if (currentMode === 'total' || currentMode === 'board') {
          text += `<span style="color:#58B2DC;">■</span> 乗車人員：${board}人<br>`;
        }
        if (currentMode === 'total') {
          text += `<strong>乗降合計：${total}人</strong>`;
        }
        if (note) {
          text += `<br><span class="tt-note">※ ${note}</span>`;
        }
        tooltip.innerHTML = text;
        tooltip.style.opacity = 1;
        move(e);
      };

      const move = (e) => {
        const px = e.pageX || (e.touches && e.touches[0].pageX) || 0;
        const py = e.pageY || (e.touches && e.touches[0].pageY) || 0;
        let x = px + 14;
        let y = py + 14;
        if (x + tooltip.offsetWidth > window.innerWidth - 10) {
          x = Math.max(10, px - tooltip.offsetWidth - 14);
        }
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      };

      el.addEventListener('mouseover', show);
      el.addEventListener('mousemove', move);
      el.addEventListener('mouseout', () => { tooltip.style.opacity = 0; });
      el.addEventListener('click', show);
    });
  }

  function openTransferModal(stCode) {
    const st = ROUTE_CONFIG.stations.find(s => s.code === stCode);
    const list = ROUTE_CONFIG.transfers[stCode];
    if (!st || !list) return;

    document.getElementById('modal-code-slot').innerHTML = createStationBadgeHtml(st);
    document.getElementById('modal-st-jp').textContent = `${st.name}駅 乗り換え路線`;
    document.getElementById('modal-st-en').textContent = `${st.en} Station Transfers`;

    document.getElementById('modal-tr-list').innerHTML = list.map(tr => `
      <li class="modal-item">
        <div class="modal-item-left">
          <span class="modal-code-pill" style="--tr-color: ${tr.color};">${tr.code}</span>
          <span>${tr.line}</span>
        </div>
        ${tr.note ? `<span class="modal-note-tag">${tr.note}</span>` : ''}
      </li>
    `).join('');

    const overlay = document.getElementById('transfer-modal');
    overlay.style.display = 'flex';
    setTimeout(() => overlay.classList.add('show'), 10);
  }

  function closePopup() {
    const overlay = document.getElementById('transfer-modal');
    overlay.classList.remove('show');
    setTimeout(() => { overlay.style.display = 'none'; }, 150);
  }

  /* =========================================================
     初期化処理
  ========================================================= */
  function initApp() {
    document.documentElement.style.setProperty('--line-theme', ROUTE_CONFIG.themeColor);
    document.getElementById('route-symbol').textContent = ROUTE_CONFIG.symbol;
    document.getElementById('route-title-jp').textContent = ROUTE_CONFIG.titleJp;
    document.getElementById('route-title-en').textContent = ROUTE_CONFIG.titleEn;
    document.getElementById('route-period').textContent = ROUTE_CONFIG.period;

    const { stdMaxMan } = getDataBounds(currentMode);
    syncScaleControls(stdMaxMan);
    renderChart();
  }

  let prevIsMobile = window.innerWidth <= 767;
  window.addEventListener('resize', () => {
    const nowIsMobile = window.innerWidth <= 767;
    if (nowIsMobile !== prevIsMobile) {
      prevIsMobile = nowIsMobile;
      renderChart();
    }
  });

  initApp();
</script>
