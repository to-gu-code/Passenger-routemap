<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都営新宿線 乗降客数路線図｜Toei Shinjuku Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================
     基本設計（直線・グリッド・角丸排除）
  ========================================== */
  :root {
    --bg-canvas: #EBEBEB;
    --bg-panel: #FFFFFF;
    --ink-main: #1A1A1A;
    --ink-sub: #595959;
    --border-dark: #222222;
    --border-mid: #999999;
    --border-light: #DCDCDC;

    /* 都営新宿線 ラインカラー＆種別カラー */
    --line-shinjuku: #6CBB5A;
    --line-shinjuku-deep: #2E7D32;
    --type-local: #4A4A4A;
    --type-express: #E60012;

    /* 棒グラフカラー（乗車・降車） */
    --bar-board: #2E7D32;
    --bar-alight: #88CE78;
  }

  * {
    box-sizing: border-box;
    border-radius: 0 !important;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans JP", sans-serif;
    background-color: var(--bg-canvas);
    color: var(--ink-main);
    -webkit-font-smoothing: antialiased;
  }

  /* ==========================================
     タイトル＆コントロールヘッダー（路線図タイトルブロック風）
  ========================================== */
  .header-area {
    background: var(--bg-panel);
    border-bottom: 2px solid var(--border-dark);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }

  .title-block {
    display: flex;
    align-items: stretch;
    gap: 12px;
  }

  .title-accent-bar {
    width: 10px;
    background-color: var(--line-shinjuku);
    flex-shrink: 0;
  }

  .title-texts {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-jp {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1.2;
    color: var(--ink-main);
  }

  .title-en {
    margin: 3px 0 0 0;
    font-family: "Inter", sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink-sub);
  }

  .header-meta-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .legend-box {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 5px 10px;
    border: 1px solid var(--border-mid);
    background: #FAFAFA;
    font-size: 11.5px;
    font-weight: 700;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    display: inline-block;
    border: 1px solid rgba(0,0,0,0.25);
  }

  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 10px;
  }

  .period-tag {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-main);
    background: #F2F2F2;
    border-left: 4px solid var(--line-shinjuku);
    padding: 4px 10px;
  }

  .toggle-group {
    display: flex;
    gap: 0;
  }

  .toggle-btn {
    padding: 6px 14px;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border-dark);
    margin-left: -1px;
    background: #FFFFFF;
    color: var(--ink-main);
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .toggle-btn:first-child {
    margin-left: 0;
  }

  .toggle-btn:hover {
    background: #EFEFEF;
  }

  .toggle-btn.active {
    background: var(--ink-main);
    color: #FFFFFF;
  }

  /* ==========================================
     メイン盤面エリア
  ========================================== */
  .scroll-wrapper {
    overflow-x: auto;
    background: var(--bg-panel);
    border: 1px solid var(--border-mid);
    margin: 18px 24px;
    padding: 24px 20px 20px;
  }

  .container {
    display: flex;
    min-width: 1380px;
  }

  /* ==========================================
     駅ナンバリング（路線図サイン風 2段矩形バッジ）
  ========================================== */
  .st-num-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 30px;
    border: 2px solid var(--line-shinjuku);
    background: #FFFFFF;
    color: var(--ink-main);
    font-family: "Roboto Condensed", "Inter", sans-serif;
    line-height: 1;
    flex-shrink: 0;
  }

  .st-num-box.is-express {
    background: var(--line-shinjuku);
    color: #FFFFFF;
  }

  .st-num-prefix {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 1px;
  }

  .st-num-digits {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* 乗換路線ナンバリング記号（矩形サイン） */
  .tr-sign {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    height: 18px;
    padding: 0 4px;
    border: 1.5px solid var(--tr-color, #444);
    background: #FFFFFF;
    color: var(--ink-main);
    font-family: "Roboto Condensed", "Inter", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
    white-space: nowrap;
  }

  .tr-more-sign {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    height: 17px;
    padding: 0 4px;
    border: 1px solid #888888;
    background: #F4F4F4;
    color: #333333;
    font-family: "Roboto Condensed", sans-serif;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
  }

  /* ==========================================
     ツールチップ（直線・黒枠）
  ========================================== */
  #tooltip {
    position: absolute;
    background: #1A1A1A;
    color: #FFFFFF;
    border: 1px solid #000000;
    padding: 9px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
    white-space: nowrap;
    line-height: 1.55;
  }

  #tooltip .tt-num {
    font-family: "Roboto Condensed", sans-serif;
    font-weight: 700;
  }

  /* ==========================================
     乗換詳細モーダル（直線・設計図風ダイアログ）
  ========================================== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.15s;
    padding: 16px;
  }

  .modal-overlay.show {
    display: flex;
    opacity: 1;
  }

  .modal-content {
    background: #FFFFFF;
    border: 2px solid var(--border-dark);
    padding: 20px;
    width: 100%;
    max-width: 440px;
    position: relative;
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px 0;
    border-bottom: 2px solid var(--line-shinjuku);
    padding-bottom: 10px;
  }

  .modal-title-group {
    display: flex;
    flex-direction: column;
  }

  .modal-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 900;
  }

  .modal-header span.modal-sub {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-sub);
  }

  .modal-transfer-list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .modal-transfer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 10px;
    background: #F8F8F8;
    border: 1px solid #D8D8D8;
    font-size: 13px;
    font-weight: 700;
  }

  .modal-line-left {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .modal-tr-code {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 48px;
    height: 22px;
    padding: 0 5px;
    border: 2px solid var(--tr-color, #444);
    background: #FFFFFF;
    color: var(--ink-main);
    font-family: "Roboto Condensed", sans-serif;
    font-size: 11.5px;
    font-weight: 700;
  }

  .modal-note {
    font-size: 11px;
    font-weight: 500;
    color: #444444;
    background: #EAEAEA;
    border: 1px solid #CCCCCC;
    padding: 2px 6px;
    white-space: nowrap;
  }

  .close-btn {
    width: 100%;
    padding: 9px;
    background: var(--ink-main);
    color: #FFFFFF;
    border: 1px solid var(--ink-main);
    cursor: pointer;
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 13px;
  }

  .close-btn:hover {
    background: #383838;
  }

  /* ==========================================
     グラフ・路線共通パーツ
  ========================================== */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    pointer-events: none;
  }

  .graph-area {
    position: relative;
  }

  .bar-container {
    display: flex;
  }

  .bar-segment {
    position: relative;
    z-index: 1;
    transition: flex-basis 0.3s ease-out, opacity 0.15s;
    cursor: pointer;
  }

  .bar-segment:hover {
    opacity: 0.8;
  }

  /* ==========================================
     PC表示（横並び：768px以上）
  ========================================== */
  @media (min-width: 768px) {
    .container {
      flex-direction: row;
      align-items: stretch;
      height: 620px;
    }

    /* 左端ラベル列 */
    .label-block {
      display: flex;
      flex-direction: column;
      width: 116px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-dark);
    }

    .graph-area-labels {
      flex-grow: 1;
      position: relative;
      border-bottom: 1px solid var(--border-dark);
    }

    .graph-label {
      position: absolute;
      bottom: var(--pos);
      right: 10px;
      transform: translateY(50%);
      font-family: "Roboto Condensed", "Noto Sans JP", sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-sub);
      white-space: nowrap;
    }

    .station-name-spacer {
      height: 162px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0 10px 8px 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-sub);
      border-bottom: 1px solid var(--border-light);
    }

    .line-map-labels {
      display: flex;
      flex-direction: column;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .line-label-row {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-right: 10px;
    }

    .line-label-sample {
      width: 24px;
      height: 11px;
      background-color: var(--line-color);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .line-label-sample::after {
      content: "";
      width: 9px;
      height: 9px;
      background: #FFFFFF;
      border: 2px solid var(--ink-main);
      border-radius: 50%;
    }

    .line-label-texts {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.1;
    }

    .line-label-jp {
      font-size: 11.5px;
      font-weight: 900;
      color: var(--ink-main);
    }

    .line-label-en {
      font-family: "Inter", sans-serif;
      font-size: 9px;
      font-weight: 700;
      color: var(--ink-sub);
    }

    .transfer-spacer {
      height: 114px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-end;
      padding: 8px 10px 0 0;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-sub);
      line-height: 1.3;
      text-align: right;
    }

    /* 各駅列 */
    .station-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 58px;
      position: relative;
    }

    .graph-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid var(--border-dark);
    }

    .grid-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--pos);
      border-bottom: 1px solid #EBEBEB;
    }

    .grid-line.major {
      border-bottom: 1px solid #D4D4D4;
    }

    /* PC積み上げ棒（完全矩形・白境界線） */
    .bar-container {
      width: 24px;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }

    .bar-alight {
      flex-basis: var(--alight-size);
      width: 100%;
      border-bottom: 1px solid #FFFFFF;
    }

    .bar-board {
      flex-basis: var(--board-size);
      width: 100%;
    }

    /* 駅名（日本語＋英語ローマ字縦書き）＋駅ナンバリング */
    .station-name-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 162px;
      width: 100%;
      padding: 8px 2px 8px;
      border-bottom: 1px solid var(--border-light);
      position: relative;
    }

    /* 駅名ブロックから路線帯へ伸びる縦のガイドライン */
    .station-name-container::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      height: 8px;
      background-color: #999999;
      transform: translateX(-50%);
    }

    .station-bilingual-wrap {
      display: flex;
      flex-direction: row-reverse;
      align-items: flex-end;
      justify-content: center;
      height: 112px;
      margin-bottom: 6px;
      gap: 1px;
    }

    .station-name-jp {
      writing-mode: vertical-rl;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.04em;
      color: var(--ink-main);
    }

    .station-name-jp.is-express {
      font-size: 14px;
      font-weight: 900;
    }

    .station-name-en {
      writing-mode: vertical-rl;
      font-family: "Inter", sans-serif;
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      color: #6E6E6E;
    }

    /* 路線図帯エリア（各駅停車・急行） */
    .line-map-area {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 4px 0;
      border-bottom: 1px solid var(--border-light);
      position: relative;
    }

    /* 駅位置の縦軸ガイドライン（添付画像の路線図スタイル） */
    .line-map-area::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      background-color: #999999;
      transform: translateX(-50%);
      z-index: 1;
    }

    .track {
      height: 34px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 11px;
      background-color: var(--line-color);
      z-index: 1;
    }

    /* 始発・終着駅（新宿・本八幡）で路線帯を端でピタッと止める */
    .station-block:nth-child(2) .track::before {
      width: 50%;
      right: 0;
    }
    .station-block:last-child .track::before {
      width: 50%;
      left: 0;
    }

    /* 乗換路線サイン列（路線図の下に縦並び配置） */
    .transfer-column {
      height: 114px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      position: relative;
    }

    .transfer-column.has-transfers {
      cursor: pointer;
    }

    .transfer-column.has-transfers::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 1.5px;
      height: 8px;
      background-color: #999999;
      transform: translateX(-50%);
    }

    .transfer-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 2px;
      transition: background-color 0.15s;
    }

    .transfer-column.has-transfers:hover .transfer-stack {
      background-color: #EFEFEF;
    }
  }

  /* ==========================================
     スマホ・狭幅表示（縦並び：767px以下）
  ========================================== */
  @media (max-width: 767px) {
    .header-area {
      padding: 12px 14px;
    }

    .title-jp {
      font-size: 1.1rem;
    }

    .scroll-wrapper {
      padding: 10px 10px 14px;
      margin: 10px;
      overflow-x: visible;
    }

    .container {
      flex-direction: column;
      min-width: auto;
    }

    .label-block {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 76px;
      flex-shrink: 0;
      position: sticky;
      top: 118px;
      background: #FFFFFF;
      z-index: 20;
      border-bottom: 1px solid var(--border-dark);
    }

    .line-map-labels {
      order: 1;
      display: flex;
      flex-direction: row;
      margin-right: 8px;
    }

    .line-label-row {
      width: 28px;
      writing-mode: vertical-rl;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    .line-label-sample {
      display: none;
    }

    .line-label-jp {
      font-size: 11px;
      font-weight: 900;
      color: var(--ink-main);
    }

    .line-label-en {
      display: none;
    }

    .station-name-spacer {
      order: 2;
      width: 148px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      padding-bottom: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-sub);
    }

    .transfer-spacer {
      display: none;
    }

    .graph-area-labels {
      order: 3;
      flex-grow: 1;
      position: relative;
      border-left: 1px solid var(--border-dark);
    }

    .graph-label {
      position: absolute;
      left: var(--pos);
      bottom: 5px;
      transform: translateX(-50%);
      font-family: "Roboto Condensed", sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-sub);
      white-space: nowrap;
    }

    .station-block {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-height: 66px;
      width: 100%;
      border-bottom: 1px solid var(--border-light);
    }

    .line-map-area {
      order: 1;
      display: flex;
      flex-direction: row;
      margin-right: 8px;
      flex-shrink: 0;
      position: relative;
    }

    .line-map-area::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1.5px;
      background-color: #999999;
      transform: translateY(-50%);
      z-index: 1;
    }

    .track {
      width: 28px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track::before {
      content: "";
      position: absolute;
      height: 100%;
      width: 10px;
      background-color: var(--line-color);
      z-index: 1;
    }

    .station-block:nth-child(2) .track::before {
      height: 50%;
      bottom: 0;
    }
    .station-block:last-child .track::before {
      height: 50%;
      top: 0;
    }

    .station-name-container {
      order: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      width: 148px;
      flex-shrink: 0;
      padding: 7px 6px 7px 0;
      gap: 4px;
    }

    .mobile-st-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mobile-st-names {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .station-name-jp {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-main);
    }

    .station-name-jp.is-express {
      font-weight: 900;
    }

    .station-name-en {
      font-family: "Inter", sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--ink-sub);
    }

    .transfer-column {
      order: 2;
      display: contents;
    }

    .mobile-transfer-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      cursor: pointer;
    }

    .graph-area {
      order: 3;
      flex-grow: 1;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--border-dark);
    }

    .grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--pos);
      border-left: 1px solid #EBEBEB;
    }

    .grid-line.major {
      border-left: 1px solid #D4D4D4;
    }

    /* スマホ積み上げ棒（横方向矩形） */
    .bar-container {
      height: 20px;
      flex-direction: row;
      width: 100%;
    }

    .bar-board {
      flex-basis: var(--board-size);
      height: 100%;
      border-right: 1px solid #FFFFFF;
    }

    .bar-alight {
      flex-basis: var(--alight-size);
      height: 100%;
    }
  }

  /* 停車ノード（路線図上の白丸・黒枠） */
  .node {
    width: 14px;
    height: 14px;
    background-color: #FFFFFF;
    border: 2.5px solid var(--ink-main);
    border-radius: 50% !important;
    z-index: 2;
  }

  .pass {
    visibility: hidden;
  }

  .source-footer {
    padding: 4px 24px 24px;
    font-size: 11.5px;
    color: var(--ink-sub);
    line-height: 1.65;
  }

  .source-footer a {
    color: var(--ink-main);
    font-weight: 700;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="header-area">
  <div class="header-top">
    <div class="title-block">
      <div class="title-accent-bar"></div>
      <div class="title-texts">
        <h2 class="title-jp">都営新宿線 乗降客数路線図</h2>
        <p class="title-en">Toei Shinjuku Line Passenger Volume &amp; Route Map</p>
      </div>
    </div>
    <div class="header-meta-right">
      <div class="legend-box">
        <span class="legend-item"><span class="legend-swatch" style="background: var(--bar-board);"></span>乗車人員</span>
        <span class="legend-item"><span class="legend-swatch" style="background: var(--bar-alight);"></span>降車人員</span>
      </div>
    </div>
  </div>
  <div class="controls-row">
    <div class="period-tag">集計期間：2025年4月〜2026年3月（一日平均乗降人員）</div>
    <div class="toggle-group" id="mode-toggles">
      <button class="toggle-btn mode-btn active" onclick="switchMode(event, 'total')">乗降合算（積み上げ）</button>
      <button class="toggle-btn mode-btn" onclick="switchMode(event, 'board')">乗車人員のみ</button>
      <button class="toggle-btn mode-btn" onclick="switchMode(event, 'alight')">降車人員のみ</button>
    </div>
  </div>
</div>

<div class="scroll-wrapper">
  <div class="container" id="map-container"></div>
</div>

<div class="source-footer">
  出典：<a href="https://www.kotsu.metro.tokyo.jp/subway/kanren/passengers.html#c" target="_blank" rel="noopener noreferrer">東京都交通局「各駅乗降人員一覧（新宿線 2025年4月～2026年3月）」</a><br>
  ※接続路線のナンバリング記号をクリックすると、乗り換え路線一覧を表示します。
</div>

<div id="tooltip"></div>

<div id="transfer-modal" class="modal-overlay" onclick="closePopup()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div id="modal-station-code-wrap"></div>
      <div class="modal-title-group">
        <h3 id="modal-station-name"></h3>
        <span id="modal-station-en" class="modal-sub"></span>
      </div>
    </div>
    <ul id="modal-transfer-list" class="modal-transfer-list"></ul>
    <button class="close-btn" onclick="closePopup()">閉じる</button>
  </div>
</div>

<script>
  let currentMode = 'total';

  const transferMeta = {
    "新宿": [
      { code: "KO-01", line: "京王線・京王新線", color: "#DD0077", note: "直通運転" },
      { code: "OH-01", line: "小田急小田原線", color: "#2288CC" },
      { code: "M-08", line: "東京メトロ丸ノ内線", color: "#F62E36" },
      { code: "E-27", line: "都営大江戸線", color: "#B6007A", note: "新宿西口: E-01" },
      { code: "JY-17", line: "JR山手線", color: "#9ACD32" },
      { code: "JC-05", line: "JR中央線（快速）", color: "#F15A22" },
      { code: "JB-10", line: "JR中央・総武線（各駅停車）", color: "#E5B800" },
      { code: "JA-11", line: "JR埼京線", color: "#00AC9A" },
      { code: "JS-20", line: "JR湘南新宿ライン", color: "#E21F26" }
    ],
    "新宿三丁目": [
      { code: "M-09", line: "東京メトロ丸ノ内線", color: "#F62E36" },
      { code: "F-13", line: "東京メトロ副都心線", color: "#9C5E31" }
    ],
    "市ケ谷": [
      { code: "Y-14", line: "東京メトロ有楽町線", color: "#C1A470" },
      { code: "N-09", line: "東京メトロ南北線", color: "#00AC9B" },
      { code: "JB-15", line: "JR中央・総武線（各駅停車）", color: "#E5B800" }
    ],
    "九段下": [
      { code: "T-07", line: "東京メトロ東西線", color: "#009BBF" },
      { code: "Z-06", line: "東京メトロ半蔵門線", color: "#8F76D6" }
    ],
    "神保町": [
      { code: "I-10", line: "都営三田線", color: "#006AB8" },
      { code: "Z-07", line: "東京メトロ半蔵門線", color: "#8F76D6" }
    ],
    "小川町": [
      { code: "M-19", line: "東京メトロ丸ノ内線", color: "#F62E36", note: "淡路町駅" },
      { code: "C-12", line: "東京メトロ千代田線", color: "#00BB85", note: "新御茶ノ水駅" }
    ],
    "馬喰横山": [
      { code: "A-15", line: "都営浅草線", color: "#EC6E65", note: "東日本橋駅" },
      { code: "JO-21", line: "JR総武線快速", color: "#0070B9", note: "馬喰町駅" }
    ],
    "森下": [
      { code: "E-13", line: "都営大江戸線", color: "#B6007A" }
    ],
    "住吉": [
      { code: "Z-12", line: "東京メトロ半蔵門線", color: "#8F76D6" }
    ],
    "本八幡": [
      { code: "JB-28", line: "JR中央・総武線（各駅停車）", color: "#E5B800" },
      { code: "KS-16", line: "京成本線", color: "#005AAA", note: "京成八幡駅" }
    ]
  };

  const lineData = {
    maxPassengers: 350000,
    stations: [
      { prefix: "S", num: "01", code: "S-01", name: "新宿", en: "Shinjuku", board: 151735, alight: 149161, stops: ["local", "express"] },
      { prefix: "S", num: "02", code: "S-02", name: "新宿三丁目", en: "Shinjuku-sanchome", board: 37253, alight: 38900, stops: ["local"] },
      { prefix: "S", num: "03", code: "S-03", name: "曙橋", en: "Akebonobashi", board: 18838, alight: 18361, stops: ["local"] },
      { prefix: "S", num: "04", code: "S-04", name: "市ケ谷", en: "Ichigaya", board: 46118, alight: 47426, stops: ["local", "express"] },
      { prefix: "S", num: "05", code: "S-05", name: "九段下", en: "Kudanshita", board: 58305, alight: 58488, stops: ["local", "express"] },
      { prefix: "S", num: "06", code: "S-06", name: "神保町", en: "Jimbocho", board: 63758, alight: 64034, stops: ["local", "express"] },
      { prefix: "S", num: "07", code: "S-07", name: "小川町", en: "Ogawamachi", board: 38096, alight: 38547, stops: ["local"] },
      { prefix: "S", num: "08", code: "S-08", name: "岩本町", en: "Iwamotocho", board: 27255, alight: 27302, stops: ["local"] },
      { prefix: "S", num: "09", code: "S-09", name: "馬喰横山", en: "Bakuro-yokoyama", board: 58156, alight: 58179, stops: ["local", "express"] },
      { prefix: "S", num: "10", code: "S-10", name: "浜町", en: "Hamacho", board: 11150, alight: 11295, stops: ["local"] },
      { prefix: "S", num: "11", code: "S-11", name: "森下", en: "Morishita", board: 37640, alight: 38615, stops: ["local", "express"] },
      { prefix: "S", num: "12", code: "S-12", name: "菊川", en: "Kikukawa", board: 12770, alight: 12598, stops: ["local"] },
      { prefix: "S", num: "13", code: "S-13", name: "住吉", en: "Sumiyoshi", board: 21184, alight: 21113, stops: ["local"] },
      { prefix: "S", num: "14", code: "S-14", name: "西大島", en: "Nishi-ojima", board: 14268, alight: 14282, stops: ["local"] },
      { prefix: "S", num: "15", code: "S-15", name: "大島", en: "Ojima", board: 16301, alight: 15952, stops: ["local", "express"] },
      { prefix: "S", num: "16", code: "S-16", name: "東大島", en: "Higashi-ojima", board: 15651, alight: 15636, stops: ["local"] },
      { prefix: "S", num: "17", code: "S-17", name: "船堀", en: "Funabori", board: 30109, alight: 30015, stops: ["local", "express"] },
      { prefix: "S", num: "18", code: "S-18", name: "一之江", en: "Ichinoe", board: 22319, alight: 21980, stops: ["local"] },
      { prefix: "S", num: "19", code: "S-19", name: "瑞江", en: "Mizue", board: 28221, alight: 28245, stops: ["local"] },
      { prefix: "S", num: "20", code: "S-20", name: "篠崎", en: "Shinozaki", board: 20519, alight: 20340, stops: ["local"] },
      { prefix: "S", num: "21", code: "S-21", name: "本八幡", en: "Moto-yawata", board: 37695, alight: 36869, stops: ["local", "express"] }
    ]
  };

  const trainTypes = [
    { id: "local", name: "各駅停車", en: "Local", color: "#4A4A4A" },
    { id: "express", name: "急行", en: "Express", color: "#E60012" }
  ];

  function createStationNumBox(station) {
    const isExp = station.stops.includes("express");
    return `
      <div class="st-num-box ${isExp ? 'is-express' : ''}">
        <span class="st-num-prefix">${station.prefix}</span>
        <span class="st-num-digits">${station.num}</span>
      </div>
    `;
  }

  function buildTransferSigns(station, isMobile) {
    const transfers = transferMeta[station.name];
    if (!transfers || transfers.length === 0) {
      return isMobile ? '' : '<div class="transfer-column"></div>';
    }

    const maxInline = isMobile ? transfers.length : 4;
    const visibleList = transfers.slice(0, maxInline);
    const remainCount = transfers.length - visibleList.length;

    let signsHtml = visibleList.map(tr =>
      `<span class="tr-sign" style="--tr-color: ${tr.color};" title="${tr.line}${tr.note ? '（' + tr.note + '）' : ''}">${tr.code}</span>`
    ).join('');

    if (remainCount > 0) {
      signsHtml += `<span class="tr-more-sign">+${remainCount}</span>`;
    }

    if (isMobile) {
      return `<div class="mobile-transfer-row" onclick="showTransferPopup('${station.code}')">${signsHtml}</div>`;
    }

    return `
      <div class="transfer-column has-transfers" onclick="showTransferPopup('${station.code}')" title="クリックで乗り換え路線一覧を表示">
        <div class="transfer-stack">${signsHtml}</div>
      </div>
    `;
  }

  function renderMap() {
    const container = document.getElementById('map-container');
    const maxP = lineData.maxPassengers;
    const gridValues = [50000, 100000, 150000, 200000, 250000, 300000, 350000];
    const isMobile = window.innerWidth <= 767;

    let stationGridHtml = '<div class="grid-bg">';
    gridValues.forEach(val => {
      const isMajor = val % 100000 === 0;
      stationGridHtml += `<div class="grid-line ${isMajor ? 'major' : ''}" style="--pos: ${(val / maxP) * 100}%;"></div>`;
    });
    stationGridHtml += '</div>';

    let graphLabelsHtml = `<div class="graph-label" style="--pos: 0%;">0</div>`;
    gridValues.forEach(val => {
      const labelText = (val % 100000 === 0 || !isMobile) ? `${val / 10000}万` : '';
      if (labelText) {
        graphLabelsHtml += `<div class="graph-label" style="--pos: ${(val / maxP) * 100}%;">${labelText}</div>`;
      }
    });

    let lineLabelsHtml = '';
    trainTypes.forEach(type => {
      lineLabelsHtml += `
        <div class="line-label-row" style="--line-color: ${type.color};">
          <div class="line-label-texts">
            <span class="line-label-jp">${type.name}</span>
            <span class="line-label-en">${type.en}</span>
          </div>
          <div class="line-label-sample"></div>
        </div>
      `;
    });

    let html = `
      <div class="label-block">
        <div class="graph-area-labels">${graphLabelsHtml}</div>
        <div class="station-name-spacer">駅名・駅番号</div>
        <div class="line-map-labels">${lineLabelsHtml}</div>
        <div class="transfer-spacer">乗換路線<br>ナンバリング</div>
      </div>
    `;

    lineData.stations.forEach((station) => {
      const total = station.board + station.alight;
      const isExp = station.stops.includes("express");

      let boardSize = (station.board / maxP) * 100;
      let alightSize = (station.alight / maxP) * 100;

      if (currentMode === 'board') alightSize = 0;
      if (currentMode === 'alight') boardSize = 0;

      let tracksHtml = '';
      trainTypes.forEach(type => {
        const isStop = station.stops.includes(type.id);
        tracksHtml += `<div class="track" style="--line-color: ${type.color};"><div class="node ${isStop ? '' : 'pass'}"></div></div>`;
      });

      const numBoxHtml = createStationNumBox(station);
      const transferHtml = buildTransferSigns(station, isMobile);

      if (isMobile) {
        html += `
          <div class="station-block">
            <div class="graph-area">
              ${stationGridHtml}
              <div class="bar-container" style="--board-size: ${boardSize}%; --alight-size: ${alightSize}%;">
                <div class="bar-segment bar-board" style="background-color: var(--bar-board);"
                     data-code="${station.code}" data-name="${station.name}" data-en="${station.en}" data-total="${total}" data-board="${station.board}" data-alight="${station.alight}"></div>
                <div class="bar-segment bar-alight" style="background-color: var(--bar-alight);"
                     data-code="${station.code}" data-name="${station.name}" data-en="${station.en}" data-total="${total}" data-board="${station.board}" data-alight="${station.alight}"></div>
              </div>
            </div>
            <div class="station-name-container">
              <div class="mobile-st-head">
                ${numBoxHtml}
                <div class="mobile-st-names">
                  <span class="station-name-jp ${isExp ? 'is-express' : ''}">${station.name}</span>
                  <span class="station-name-en">${station.en}</span>
                </div>
              </div>
              ${transferHtml}
            </div>
            <div class="line-map-area">
              ${tracksHtml}
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="station-block">
            <div class="graph-area">
              ${stationGridHtml}
              <div class="bar-container" style="--board-size: ${boardSize}%; --alight-size: ${alightSize}%;">
                <div class="bar-segment bar-alight" style="background-color: var(--bar-alight);"
                     data-code="${station.code}" data-name="${station.name}" data-en="${station.en}" data-total="${total}" data-board="${station.board}" data-alight="${station.alight}"></div>
                <div class="bar-segment bar-board" style="background-color: var(--bar-board);"
                     data-code="${station.code}" data-name="${station.name}" data-en="${station.en}" data-total="${total}" data-board="${station.board}" data-alight="${station.alight}"></div>
              </div>
            </div>
            <div class="station-name-container">
              <div class="station-bilingual-wrap">
                <span class="station-name-jp ${isExp ? 'is-express' : ''}">${station.name}</span>
                <span class="station-name-en">${station.en}</span>
              </div>
              ${numBoxHtml}
            </div>
            <div class="line-map-area">
              ${tracksHtml}
            </div>
            ${transferHtml}
          </div>
        `;
      }
    });

    container.innerHTML = html;
    initTooltip();
  }

  function switchMode(ev, modeStr) {
    currentMode = modeStr;
    const btns = document.getElementById('mode-toggles').querySelectorAll('.mode-btn');
    btns.forEach(b => b.classList.remove('active'));
    ev.currentTarget.classList.add('active');
    renderMap();
  }

  function initTooltip() {
    const tooltip = document.getElementById('tooltip');
    document.querySelectorAll('.bar-segment').forEach(seg => {
      const showTip = (e) => {
        const code = seg.getAttribute('data-code');
        const name = seg.getAttribute('data-name');
        const en = seg.getAttribute('data-en');
        const total = parseInt(seg.getAttribute('data-total')).toLocaleString();
        const board = parseInt(seg.getAttribute('data-board')).toLocaleString();
        const alight = parseInt(seg.getAttribute('data-alight')).toLocaleString();

        let html = `<span class="tt-num">${code}</span> <strong>${name}</strong> <span style="color:#BBBBBB; font-size:11px;">(${en})</span><br>`;
        if (currentMode === 'total' || currentMode === 'alight') {
          html += `<span style="color:#88CE78;">■</span> 降車人員：${alight}人<br>`;
        }
        if (currentMode === 'total' || currentMode === 'board') {
          html += `<span style="color:#6CBB5A;">■</span> 乗車人員：${board}人<br>`;
        }
        if (currentMode === 'total') {
          html += `<strong>乗降合計：${total}人</strong>`;
        }
        tooltip.innerHTML = html;
        tooltip.style.opacity = 1;
        moveTip(e);
      };

      const moveTip = (e) => {
        const pageX = e.pageX || (e.touches && e.touches[0].pageX) || 0;
        const pageY = e.pageY || (e.touches && e.touches[0].pageY) || 0;
        let x = pageX + 14;
        let y = pageY + 14;
        if (x + tooltip.offsetWidth > window.innerWidth - 10) {
          x = Math.max(10, pageX - tooltip.offsetWidth - 14);
        }
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
      };

      seg.addEventListener('mouseover', showTip);
      seg.addEventListener('mousemove', moveTip);
      seg.addEventListener('mouseout', () => {
        tooltip.style.opacity = 0;
      });
      seg.addEventListener('click', showTip);
    });
  }

  function showTransferPopup(stationCode) {
    const station = lineData.stations.find(s => s.code === stationCode);
    if (!station) return;
    const transfers = transferMeta[station.name];
    if (!transfers) return;

    document.getElementById('modal-station-code-wrap').innerHTML = createStationNumBox(station);
    document.getElementById('modal-station-name').textContent = station.name + '駅 乗り換え路線';
    document.getElementById('modal-station-en').textContent = station.en + ' Station Transfers';

    const ul = document.getElementById('modal-transfer-list');
    ul.innerHTML = transfers.map(tr => `
      <li class="modal-transfer-item">
        <div class="modal-line-left">
          <span class="modal-tr-code" style="--tr-color: ${tr.color};">${tr.code}</span>
          <span>${tr.line}</span>
        </div>
        ${tr.note ? `<span class="modal-note">${tr.note}</span>` : ''}
      </li>
    `).join('');

    const modal = document.getElementById('transfer-modal');
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
  }

  function closePopup() {
    const modal = document.getElementById('transfer-modal');
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 150);
  }

  let lastIsMobile = window.innerWidth <= 767;
  window.addEventListener('resize', () => {
    const nowIsMobile = window.innerWidth <= 767;
    if (nowIsMobile !== lastIsMobile) {
      lastIsMobile = nowIsMobile;
      renderMap();
    }
  });

  renderMap();
</script>

</body>
</html>
